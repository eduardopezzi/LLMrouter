# Official sources checked by the weekly provider-catalog workflow.
# Model APIs require the corresponding *_API_KEY when the provider requires it.
# model_allowlist keeps only the reviewed Z.ai chat models; model_denylist retires
# exact Ollama IDs from both discovery proposals and the active catalog.
sources:
  - provider: "ollama"
    kind: "model_api"
    url: "https://ollama.com/api/tags"
    # Public Ollama catalog inventory is not the set installed on the Yoda instance.
    complete_inventory: false
    api_key_env: "OLLAMA_API_KEY"
    model_denylist:
      # IDs absent from Yoda's Ollama /api/tags inventory (avoid auto-reactivating them).
      - "kimi-k3:cloud"
      - "deepseek-v4-flash:0731-cloud"
      - "north-mini-code-1.0:cloud"
      - "qwen3.6-27b:cloud"
      - "gemma4:31b"
      - "deepseek-v3.2:cloud"
      - "deepseek-v3.1:cloud"
      - "glm-5.3-flash"
      - "mistral-large-3:675b"
      - "glm-5.3"
      - "kimi-k2.7-code"
      - "qwen3.5:397b"
      - "nemotron-3-ultra"
      - "deepseek-v4.1-flash"
      - "gpt-oss:20b"
      - "kimi-k3"
      - "minimax-m2.7"
      - "minimax-m3"
      - "gpt-oss:120b"
      - "nemotron-3-nano:30b"
      - "nemotron-3-super"
      - "deepseek-v4-flash:0731"
      - "deepseek-v4-pro:0813"
      - "glm-5.1"
      - "kimi-k2.6"
  - provider: "ollama"
    kind: "documentation"
    url: "https://ollama.com/library"

  - provider: "deepseek"
    kind: "model_api"
    url: "https://api.deepseek.com/models"
    api_key_env: "DEEPSEEK_API_KEY"
  - provider: "deepseek"
    kind: "documentation"
    url: "https://api-docs.deepseek.com/api/list-models"
  - provider: "deepseek"
    kind: "documentation"
    url: "https://api-docs.deepseek.com/updates/"

  - provider: "zai"
    kind: "documentation"
    url: "https://docs.z.ai/guides/llm/glm-5.3"
    model_allowlist:
      - "glm-5.3"
      - "glm-5.3-flash"
  - provider: "zai"
    kind: "documentation"
    url: "https://docs.z.ai/guides/vlm/glm-5.3-flash"
    model_allowlist:
      - "glm-5.3"
      - "glm-5.3-flash"
